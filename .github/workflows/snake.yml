name: Generate Snake Contribution Grid

on:
  schedule:
    - cron: "0 */3 * * *"  # Runs every 6 hours
  workflow_dispatch:  # Allows manual execution

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3  # Ensures the repo is available

      # Generates the snake
      - name: Generate Snake Animation
        uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: InsightfulSantosh
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Uploads the generated snake file
      - name: Upload Snake SVG
        uses: actions/upload-artifact@v4  # FIXED: Updated to v4
        with:
          name: snake-gif
          path: dist/github-contribution-grid-snake.svg

      # Deploy the snake animation to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
